<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="eleveList">
         <h1 class="example-app-name">Création d'un élève</h1>
         <div class="eleveList-menu">
            <button mat-flat-button [routerLink]="['/eleve']">Retour</button>
            <button mat-flat-button (click)="creerEleve()" [disabled]="registrationForm.invalid">Valider</button>
         </div>
    </mat-toolbar-row>
</mat-toolbar>
<form class="form" [formGroup]="registrationForm">
    <mat-card appearance="outlined">
        <mat-card-header><h3>Données de l'élève</h3></mat-card-header>
        <mat-card-content class="donnees-eleve">
            <mat-form-field appearance="outline">
                <mat-label>Nom</mat-label>
                <input matInput formControlName="nom">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Prenom</mat-label>
                <input matInput formControlName="prenom">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Adresse</mat-label>
                <input matInput formControlName="adresse">
            </mat-form-field>
        </mat-card-content>
    </mat-card>
    <mat-card appearance="outlined">
        <mat-card-header><h3>Affectation de l'élève</h3></mat-card-header>
        <mat-card-content>
            <mat-form-field>
                <mat-label>Classe</mat-label>
                <mat-select formControlName="classe">
                    @for (classe of classeList; track classe) {
                        <mat-option [value]="classe">{{classe.nom}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </mat-card-content>
    </mat-card>    
</form>
