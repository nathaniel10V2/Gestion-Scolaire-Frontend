<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="classeConsultation">
         <h1 class="example-app-name">Consultation de la classe: {{classe?.nom}}</h1>
    </mat-toolbar-row>
</mat-toolbar>
<mat-tab-group>
    <mat-tab label="Classe">
        <form>
            <mat-card appearance="outlined">
                <mat-card-header><h3>Données de la {{classe?.nom}}</h3></mat-card-header>
                <mat-card-content class="donnees-classe">
                    <mat-form-field appearance="outline">
                        <mat-label>Nom</mat-label>
                        <input matInput readonly="true" [value]="classe?.nom">
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </form>   
    </mat-tab>
    <mat-tab label="Elèves">
        <table mat-table [dataSource]="eleves" class="mat-elevation-z8">
            <ng-container matColumnDef="nom">
                <th mat-header-cell *matHeaderCellDef> Nom </th>
                <td mat-cell *matCellDef="let element">{{element.nom}}</td>
            </ng-container>
            <ng-container matColumnDef="prenom">
                <th mat-header-cell *matHeaderCellDef> Prenom </th>
                <td mat-cell *matCellDef="let element" class="space-between"> {{element.prenom}}
                    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                        <mat-icon>more_vert</mat-icon>
                      </button>
                      <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="openDialogEleve(element)">Modifier</button>
                      </mat-menu>     
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colonneEleve"></tr>
            <tr mat-row *matRowDef="let row; columns: colonneEleve;"></tr>    
        </table> 
    </mat-tab>
    <mat-tab label="Professeurs">
        <table mat-table [dataSource]="professeurs" class="mat-elevation-z8">
            <ng-container matColumnDef="nom">
                <th mat-header-cell *matHeaderCellDef> Nom </th>
                <td mat-cell *matCellDef="let element">{{element.nom}}</td>
            </ng-container>
            <ng-container matColumnDef="matiere">
                <th mat-header-cell *matHeaderCellDef> Matiere </th>
                <td mat-cell *matCellDef="let element" class="space-between"> {{element.matiere.nom}} 
                    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="modifier(element)">Modifier</button>
                    <button mat-menu-item (click)="supprimer(element)">Retirer</button>
                    </mat-menu>  
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colonneProfesseur"></tr>
            <tr mat-row *matRowDef="let row; columns: colonneProfesseur;"></tr>    
        </table>         
    </mat-tab>
    <mat-tab label="Emploi du temps">
        <mat-toolbar color="primary" class="row">
            <button mat-flat-button (click)="openDialog()" [disabled]="ouvert">Attribuer Cours</button>
            <button mat-flat-button (click)="trier()" [disabled]="(classe && classe.cours.length < 2) || !classe">Trier</button>
            <h2>Emploi du Temps de la {{this.classe?.nom}}</h2>
        </mat-toolbar>
        <table mat-table [dataSource]="coursListAffichee" class="mat-elevation-z8">
            <ng-container matColumnDef="jour">
                <th mat-header-cell *matHeaderCellDef> Jour </th>
                <td mat-cell *matCellDef="let element">{{element.jour}}</td>
            </ng-container>
            <ng-container matColumnDef="matiere">
                <th mat-header-cell *matHeaderCellDef> Matiere </th>
                <td mat-cell *matCellDef="let element"> {{element.matiere.nom}} </td>
            </ng-container>
            <ng-container matColumnDef="duree">
                <th mat-header-cell *matHeaderCellDef> Durée </th>
                <td mat-cell *matCellDef="let element"> {{element.duree}} </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colonneCours"></tr>
            <tr mat-row (click)="modifierCours(row)" *matRowDef="let row; columns: colonneCours;"></tr>    
        </table>        
    </mat-tab>
</mat-tab-group>
