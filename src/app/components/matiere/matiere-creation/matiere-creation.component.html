<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="matiereList">
         <h1 class="example-app-name">Création d'une matière</h1>
         <div class="matiereList-menu">
            <button mat-flat-button [routerLink]="['/matiere']">Retour</button>
            <button mat-flat-button (click)="creerMatiere()" [disabled]="registrationForm.invalid">Valider</button>
         </div>
    </mat-toolbar-row>
</mat-toolbar>
<form class="form" [formGroup]="registrationForm">
    <mat-card appearance="outlined">
        <mat-card-header><h3>Données de la matière</h3></mat-card-header>
        <mat-card-content class="donnees-matiere">
            <mat-form-field appearance="outline">
                <mat-label>Nom</mat-label>
                <input matInput formControlName="nom">
            </mat-form-field>
        </mat-card-content>
    </mat-card>
</form>
