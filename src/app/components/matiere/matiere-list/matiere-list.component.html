<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="matiereList">
         <h1 class="example-app-name">Gestion des matières</h1>
         <div class="matiereList-menu">
            <a [routerLink]="['/matiere/creation']">
                <button mat-flat-button>Créer</button>
            </a>
         </div>
    </mat-toolbar-row>
</mat-toolbar>
<section>
    <div class="column">
        <table mat-table [dataSource]="matiereList" class="mat-elevation-z8">
            <ng-container matColumnDef="nom">
                <th mat-header-cell *matHeaderCellDef> Nom </th>
                <td mat-cell *matCellDef="let element"> {{element.nom}} </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colonne"></tr>
            <tr mat-row (click)="obtenirMatiere(row)" *matRowDef="let row; columns: colonne;"></tr>    
        </table>
    </div>
</section>
