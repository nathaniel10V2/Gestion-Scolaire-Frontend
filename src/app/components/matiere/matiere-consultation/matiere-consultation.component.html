<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="matiereConsultation">
         <h1 class="example-app-name">Consultation du matiere {{matiere?.nom}}</h1>      
    </mat-toolbar-row>
</mat-toolbar>
<mat-tab-group>
    <mat-tab label="Matiere">
        <form>
            <mat-card appearance="outlined">
                <mat-card-header><h3>Données de {{matiere?.nom}}</h3></mat-card-header>
                <mat-card-content class="donnees-matiere">
                    <mat-form-field appearance="outline">
                        <mat-label>Nom</mat-label>
                        <input matInput readonly="true" [value]="matiere?.nom">
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </form>   
    </mat-tab>
    <mat-tab label="Professeurs">
        <table mat-table [dataSource]="professeurList" class="mat-elevation-z8">
            <ng-container matColumnDef="nom">
                <th mat-header-cell *matHeaderCellDef> Nom </th>
                <td mat-cell *matCellDef="let element">{{element.nom}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colonne"></tr>
            <tr mat-row *matRowDef="let row; columns: colonne;"></tr>    
        </table>         
    </mat-tab>
</mat-tab-group>
