<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="professeurConsultation">
         <h1 class="example-app-name">Consultation du professeur {{professeur?.nom}}</h1>
         <div class="professeurConsultationMenu">
            <a [routerLink]="['/professeur/modification/'+professeur?.id+'']">
                <button mat-flat-button>Modification</button>
            </a>
         </div>         
    </mat-toolbar-row>
</mat-toolbar>
<mat-tab-group>
    <mat-tab label="Professeur">
        <form>
            <mat-card appearance="outlined">
                <mat-card-header><h3>Données de {{professeur?.nom}}</h3></mat-card-header>
                <mat-card-content class="donnees-professeur">
                    <mat-form-field appearance="outline">
                        <mat-label>Nom</mat-label>
                        <input matInput readonly="true" [value]="professeur?.nom">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Matière</mat-label>
                        <input matInput readonly="true" [value]="professeur?.matiere?.nom">
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </form>   
    </mat-tab>
    <mat-tab label="Classes">
        <table mat-table [dataSource]="classeList" class="mat-elevation-z8">
            <ng-container matColumnDef="nom">
                <th mat-header-cell *matHeaderCellDef> Nom </th>
                <td mat-cell *matCellDef="let element" class="space-between">{{element.nom}}
                    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="supprimerClasse(element)">Retirer</button>
                    </mat-menu>  
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colonne"></tr>
            <tr mat-row *matRowDef="let row; columns: colonne;"></tr>    
        </table>         
    </mat-tab>
</mat-tab-group>
