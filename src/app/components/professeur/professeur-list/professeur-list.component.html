<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="professeurList">
         <h1 class="example-app-name">Gestion des professeurs</h1>
         <div class="professeurList-menu">
            <a [routerLink]="['/professeur/creation']">
                <button mat-flat-button>Créer</button>
            </a>
         </div>
    </mat-toolbar-row>
</mat-toolbar>
<section>
    <div class="column">
        <table mat-table [dataSource]="professeurList" class="mat-elevation-z8">
            <ng-container matColumnDef="nom">
                <th mat-header-cell *matHeaderCellDef> Nom </th>
                <td mat-cell *matCellDef="let element"> {{element.nom}} </td>
            </ng-container>
            <ng-container matColumnDef="matiere">
                <th mat-header-cell *matHeaderCellDef> Matiere </th>
                <td mat-cell *matCellDef="let element"> 
                    @if(element.matiere) {
                        {{element.matiere.nom}}
                    }
                    @else {
                        Aucune
                    }
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colonne"></tr>
            <tr mat-row (click)="obtenirProfesseur(row)" *matRowDef="let row; columns: colonne;"></tr>    
        </table>
    </div>
</section>
