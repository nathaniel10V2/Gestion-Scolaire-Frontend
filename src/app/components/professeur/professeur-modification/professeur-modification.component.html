<mat-toolbar color="primary" class="header">
    <mat-toolbar-row class="professeurList">
         <h1 class="example-app-name">Modification du professeur {{professeur?.nom}}</h1>
         <div class="professeurList-menu">
            <button mat-flat-button (click)="modifierProfesseur()">Valider</button>
         </div>
    </mat-toolbar-row>
</mat-toolbar>
<form class="form" [formGroup]="registrationForm">
    <mat-card appearance="outlined">
        <mat-card-header><h3 mat-dialog-title>Données du professeur</h3></mat-card-header>
        <mat-card-content class="donnees-professeur">
            <mat-form-field appearance="outline">
                <mat-label>Nom</mat-label>
                <input matInput formControlName="nom">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Matière</mat-label>
                <input matInput readonly="true" [value]="professeur?.matiere?.nom">
            </mat-form-field>
        </mat-card-content>
    </mat-card>
    <mat-card appearance="outlined">
        <mat-card-header><h3>Classes du professeur</h3></mat-card-header>
        <mat-card-content>
            <mat-form-field>
                <mat-label>Classes</mat-label>
                <mat-select>
                    @for (classe of professeur?.classes; track classe) {
                        <mat-option readonly="true" [value]="classe">{{classe.nom}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </mat-card-content>
    </mat-card>
    <mat-card appearance="outlined">
        <mat-card-header><h3>Liste des Classes</h3></mat-card-header>
        <mat-card-content>
            <mat-form-field>
                <mat-label>Classe</mat-label>
                <mat-select formControlName="classe" multiple>
                    @for (classe of classeList; track classe) {
                        <mat-option [value]="classe">{{classe.nom}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </mat-card-content>
    </mat-card> 
</form>
