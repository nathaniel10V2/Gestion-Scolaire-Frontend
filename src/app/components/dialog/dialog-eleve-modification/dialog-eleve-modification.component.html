<form class="form-dialog" [formGroup]="registrationForm">
    <h1 mat-dialog-title>Modification de {{data.eleve.nom}} {{data.eleve.prenom}}</h1>
    <div class="form">
        <mat-card appearance="outlined">
            <mat-card-header><h3>Données de l'élève</h3></mat-card-header>
            <mat-card-content class="donnees-eleve">
                <mat-form-field appearance="outline">
                    <mat-label>Nom</mat-label>
                    <input matInput formControlName="nom">
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Prenom</mat-label>
                    <input matInput formControlName="prenom">
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Adresse</mat-label>
                    <input matInput formControlName="adresse">
                </mat-form-field>
            </mat-card-content>
        </mat-card>
        <mat-card appearance="outlined">
            <mat-card-header><h3>Affectation de la classe de l'élève</h3></mat-card-header>
            <mat-card-content>
                <mat-form-field>
                    <mat-label>Classe</mat-label>
                    <mat-select formControlName="classe">
                        @for (classe of classeList; track classe) {
                            <mat-option [value]="classe">{{classe.nom}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </mat-card-content>
        </mat-card> 
    </div>
    <div class="dialog-actions">
        <button mat-flat-button mat-dialog-close (click)="modifierEleve()" [disabled]="registrationForm.invalid">Valider</button>
    </div>
</form>
