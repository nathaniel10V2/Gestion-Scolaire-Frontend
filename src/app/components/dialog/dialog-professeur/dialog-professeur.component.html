<form class="form-dialog" [formGroup]="registrationForm">
    <h1 mat-dialog-title>Modification du professeur {{data.professeur.nom}}</h1>
    <div class="form">
        <mat-card appearance="outlined">
            <mat-card-header><h3>Données du professeur</h3></mat-card-header>
            <mat-card-content class="donnees-professeur">
                <mat-form-field appearance="outline">
                    <mat-label>Nom</mat-label>
                    <input matInput [value]="data.professeur.nom" formControlName="nom">
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Matière</mat-label>
                    <input matInput readonly="true" [value]="data.professeur.matiere?.nom">
                </mat-form-field>
            </mat-card-content>
        </mat-card>
        <mat-card appearance="outlined">
            <mat-card-header><h3>Classes du professeur</h3></mat-card-header>
            <mat-card-content>
                <mat-form-field>
                    <mat-label>Classes</mat-label>
                    <mat-select>
                        @for (classe of data.professeur.classes; track classe) {
                            <mat-option readonly="true" [value]="classe">{{classe.nom}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </mat-card-content>
        </mat-card> 
        <mat-card appearance="outlined">
            <mat-card-header><h3>Liste des Classes</h3></mat-card-header>
            <mat-card-content>
                <mat-form-field>
                    <mat-label>Classes</mat-label>
                    <mat-select formControlName="classe" multiple>
                        @for (classe of classeList; track classe) {
                            <mat-option [value]="classe">{{classe.nom}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </mat-card-content>
        </mat-card> 
    </div>
    <div class="dialog-actions">
        <button mat-flat-button mat-dialog-close (click)="modifierProfesseur()">Valider</button>
    </div>
</form>
